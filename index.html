<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Finance v2</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #111827; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/macros/s/AKfycbwQTfsa7x-F508jHOGSD-czdS8gbF2CgheznLcUs-b1RjmvXLl-yqH1c3HEU-4Ww--zTw/exec?v=2&authuser=0" allowfullscreen></iframe>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker berhasil didaftarkan:', reg.scope))
            .catch((err) => console.error('Pendaftaran Service Worker gagal:', err));
        });
      }
    </script>
</body>
</html>
